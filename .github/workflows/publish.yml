# Publishes magpie-vetta to npm when a version tag (v0.2.1, …) is pushed.
# npm trusted publishing (OIDC): no token is stored here, and npm attaches a
# provenance statement tying the tarball to this repository and commit.
# The npm side is set once, by a maintainer of the package:
#   npm trust github magpie-vetta --file publish.yml --repo openvetta/magpie-vetta --allow-publish
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm's OIDC exchange and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5+, which speaks trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci
      - name: tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json is $version"
            exit 1
          fi
      - name: committed dist is current
        # Magpie's GitHub discovery reads dist/ from the repository, so the
        # committed build must be the one npm gets.
        run: git diff --exit-code -- dist
      - name: publish
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is on npm already"
            exit 0
          fi
          npm publish --access public --provenance
